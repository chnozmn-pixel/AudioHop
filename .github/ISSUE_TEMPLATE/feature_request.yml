name: Feature request
description: Suggest something AudioHop should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AudioHop is meant to stay one small executable that switches the sound
        device quickly. Ideas that fit that are the ones most likely to land.
        An equalizer is already on the roadmap.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution - it often suggests a simpler fix.
      placeholder: |
        I switch between a headset and speakers while gaming, and I cannot see
        which one is active without opening the picker.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like AudioHop to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried instead
      description: Other tools, workarounds, or an existing AudioHop feature that nearly does it.
