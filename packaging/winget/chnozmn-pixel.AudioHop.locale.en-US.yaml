ShortDescription: Switch the Windows sound device from the tray or an on-screen picker.
Description: |-
  AudioHop sits in the system tray and makes changing the playback or recording
  device a single step. Press a hotkey and a small picker appears on top of
  whatever is on screen: choose an output with the arrow keys, the mouse or a
  number key, set its volume, done. Hotkeys are yours to pick - nothing is
  pre-assigned - and a first-run wizard suggests combinations that are provably
  free. The interface follows your Windows language across 15 built-in
  translations, and switching sets all three audio roles at once, so games,
  media players and call apps follow together.
